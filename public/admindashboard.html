<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Antrian By One</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #12141d; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 20px; color: #ffb74d; }
    .btn-reset {
      background: #e53935; color: #fff; border: none; padding: 8px 14px;
      border-radius: 8px; font-weight: 700; cursor: pointer;
    }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #1e2230; padding: 14px; border-radius: 10px;
      display: flex; justify-content: space-between; align-items: center;
      border-left: 5px solid #4caf50;
    }
    .card.skip { border-left-color: #ff1744; }
    .card.vip { border-left-color: #ffd600; }
    .meta { font-size: 12px; color: #90a4ae; margin-top: 4px; }
    .btn-done {
      background: #00c853; color: #000; border: none; padding: 8px 14px;
      border-radius: 8px; font-weight: 800; cursor: pointer;
    }
    .empty { text-align: center; color: #78909c; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="top">
    <h1>🎮 Panel Admin Antrian</h1>
    <button class="btn-reset" onclick="resetAntrian()">Reset Semua</button>
  </div>
  <div class="list" id="list">
    <div class="empty">Antrian kosong</div>
  </div>

  <script>
    const socket = io();
    const listEl = document.getElementById('list');

    socket.on('update_antrian', (data) => {
      if (!data || data.length === 0) {
        listEl.innerHTML = '<div class="empty">Antrian kosong</div>';
        return;
      }

      listEl.innerHTML = data.map((item, idx) => {
        const cls = item.tier === 'Skip All' ? 'skip' : (item.tier === 'VIP' ? 'vip' : '');
        return `
          <div class="card ${cls}">
            <div>
              <strong>#${idx + 1} ${escapeHtml(item.nama)}</strong> [${escapeHtml(item.tier)}]
              <div class="meta">Rp ${Number(item.nominal).toLocaleString('id-ID')} • ${escapeHtml(item.pesan)}</div>
            </div>
            <button class="btn-done" onclick="hapus(${item.id})">Selesai</button>
          </div>
        `;
      }).join('');
    });

    function hapus(id) {
      socket.emit('hapus_antrian', id);
    }

    function resetAntrian() {
      if (confirm('Yakin hapus semua antrian?')) {
        socket.emit('reset_antrian');
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
  </script>
</body>
</html>
