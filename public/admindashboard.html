<!DOCTYPE html>
<html>
<head>
  <title>Admin Antrian FF</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 550px; margin: auto; }
    .item { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 10px; margin-bottom: 8px; border-radius: 6px; }
    button { background: #e53935; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.add { background: #43a047; }
    input, select { padding: 8px; border-radius: 4px; border: none; margin-right: 5px; }
  </style>
</head>
<body>
  <h2>🎮 Kontrol Antrian By One</h2>
  <div style="margin-bottom: 15px; display: flex; gap: 5px;">
    <input id="mName" placeholder="Nama / Nick FF">
    <input id="mNote" placeholder="ID / Catatan">
    <select id="mTier">
      <option value="REGULER">Reguler (5k)</option>
      <option value="VIP">VIP (10k)</option>
      <option value="SKIP ALL">Skip All (15k)</option>
    </select>
    <button class="add" onclick="addManual()">+ Tambah</button>
  </div>
  <div id="adminList"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    socket.on('updateQueue', (queue) => {
      document.getElementById('adminList').innerHTML = queue.map((q, i) => `
        <div class="item">
          <div>
            <strong>#${i+1} [${q.tier}] ${q.name}</strong> (Rp${q.amount.toLocaleString('id-ID')})<br>
            <small style="color:#aaa">${q.note}</small>
          </div>
          <button onclick="done(${q.id})">Selesai</button>
        </div>
      `).join('');
    });

    function done(id) { socket.emit('removeQueue', id); }
    function addManual() {
      const name = document.getElementById('mName').value;
      const note = document.getElementById('mNote').value;
      const tier = document.getElementById('mTier').value;
      if(!name) return;
      socket.emit('addManual', { name, amount: 0, note: note || '-', tier });
      document.getElementById('mName').value = '';
      document.getElementById('mNote').value = '';
    }
  </script>
</body>
</html>
