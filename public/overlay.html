<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Antrian By One</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: transparent; color: #fff; padding: 16px; overflow: hidden; }
    .box {
      width: 380px;
      background: rgba(15, 17, 26, 0.88);
      border: 2px solid #ff9800;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .header {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffb74d;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 10px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.08);
      padding: 10px 12px;
      border-radius: 10px;
      border-left: 5px solid #4caf50;
      animation: slideIn 0.3s ease;
    }
    .item.skip { border-left-color: #ff1744; background: rgba(255, 23, 68, 0.18); }
    .item.vip { border-left-color: #ffd600; background: rgba(255, 214, 0, 0.15); }
    .info { display: flex; flex-direction: column; gap: 2px; max-width: 240px; }
    .nama { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pesan { font-size: 12px; color: #cfd8dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      background: #4caf50;
      color: #000;
      text-transform: uppercase;
    }
    .item.skip .badge { background: #ff1744; color: #fff; }
    .item.vip .badge { background: #ffd600; color: #000; }
    .empty { text-align: center; color: #90a4ae; font-size: 13px; padding: 14px 0; }
    .more {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #ffb74d;
      margin-top: 4px;
      opacity: 0.9;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-15px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="header">🔥 ANTRIAN BY ONE 🔥</div>
    <div class="list" id="list">
      <div class="empty">Belum ada yang antri...</div>
    </div>
  </div>

  <script>
    const socket = io();
    const listEl = document.getElementById('list');
    const MAX_TAMPIL = 5; // Maksimal tampil urutan 1 - 5

    socket.on('update_antrian', (data) => {
      if (!data || data.length === 0) {
        listEl.innerHTML = '<div class="empty">Belum ada yang antri...</div>';
        return;
      }

      const visibleItems = data.slice(0, MAX_TAMPIL);
      const sisaAntrian = data.length - MAX_TAMPIL;

      let html = visibleItems.map((item, idx) => {
        const cls = item.tier === 'Skip All' ? 'skip' : (item.tier === 'VIP' ? 'vip' : '');
        return `
          <div class="item ${cls}">
            <div class="info">
              <div class="nama">#${idx + 1} ${escapeHtml(item.nama)}</div>
              <div class="pesan">${escapeHtml(item.pesan)}</div>
            </div>
            <div class="badge">${escapeHtml(item.tier)}</div>
          </div>
        `;
      }).join('');

      // Info tambahan jika ada antrian ke-6 dst yang di-hide
      if (sisaAntrian > 0) {
        html += `<div class="more">+${sisaAntrian} antrian lainnya menunggu...</div>`;
      }

      listEl.innerHTML = html;
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
  </script>
</body>
</html>
